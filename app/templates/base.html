<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false}'>
  <title>{% block title %}Container{% endblock %} · Docker-Dashboard</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body {% if user %}hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'{% endif %}>
  {% if user %}
  <header class="kopf">
    <a class="marke" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="5" height="5" rx="1"/><rect x="9.5" y="9" width="5" height="5" rx="1"/><rect x="16" y="9" width="5" height="5" rx="1"/><rect x="9.5" y="3" width="5" height="5" rx="1"/><path d="M2 16h20c-1 3.5-4.5 5-9 5s-9-1.5-11-5z"/></svg>
      <span>Docker-Dashboard</span>
    </a>
    <nav>
      <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Übersicht</a>
      <a href="/aktionen" {% if request.url.path == "/aktionen" %}aria-current="page"{% endif %}>Aktionslog</a>
    </nav>
    <div class="kopf-rechts">
      <button type="button" class="icon-btn" id="theme-toggle" title="Hell/Dunkel umschalten" aria-label="Hell/Dunkel umschalten">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      </button>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit" class="btn btn-leise" title="Abmelden">{{ user }} · Abmelden</button>
      </form>
    </div>
  </header>
  {% endif %}

  <main class="inhalt">
    {% block content %}{% endblock %}
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <dialog id="bestaetigen" class="dialog">
    <form method="dialog">
      <p id="bestaetigen-text"></p>
      <div class="dialog-knoepfe">
        <button value="nein" class="btn btn-leise">Abbrechen</button>
        <button value="ja" class="btn btn-primaer" id="bestaetigen-ja">Ausführen</button>
      </div>
    </form>
  </dialog>
</body>
</html>

{% extends "base.html" %}
{% block title %}Übersicht{% endblock %}
{% block content %}
<div class="werkzeugleiste">
  <h1>Container</h1>
  <div class="werkzeuge">
    <input type="search" id="suche" placeholder="Container suchen …" aria-label="Container suchen">
    <label class="schalter" title="Automatisch alle {{ s.refresh_seconds }} Sekunden aktualisieren">
      <input type="checkbox" id="auto-refresh" checked>
      <span>Auto ({{ s.refresh_seconds }} s)</span>
    </label>
    <button type="button" class="btn btn-leise" hx-get="/partials/liste" hx-target="#liste"
            hx-indicator="#lade" title="Jetzt aktualisieren">Aktualisieren</button>
    <span id="lade" class="lade-indikator" aria-hidden="true"></span>
  </div>
</div>

<div id="liste" hx-get="/partials/liste" hx-trigger="auto-refresh" hx-indicator="#lade"
     data-intervall="{{ s.refresh_seconds }}">
  {% include "_liste.html" %}
</div>
{% endblock %}

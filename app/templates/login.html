{% extends "base.html" %}
{% block title %}Anmeldung{% endblock %}
{% block content %}
<section class="login-karte">
  <h1>Docker-Dashboard</h1>
  <p class="leise">Bitte anmelden.</p>
  {% if fehler %}<p class="meldung meldung-fehler" role="alert">{{ fehler }}</p>{% endif %}
  <form method="post" action="/login" class="formular">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Benutzername
      <input name="username" autocomplete="username" required autofocus>
    </label>
    <label>Passwort
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primaer">Anmelden</button>
  </form>
  <button type="button" class="icon-btn login-theme" id="theme-toggle" title="Hell/Dunkel umschalten" aria-label="Hell/Dunkel umschalten">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
  </button>
</section>
{% endblock %}
